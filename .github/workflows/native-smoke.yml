name: Native text bridge smoke

on:
  push:
    paths:
      - '**/*.cs'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '.github/workflows/native-smoke.yml'
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.cpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '.github/workflows/native-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    name: Native bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      DELTATEXT_REQUIRE_NATIVE_SMOKE: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    defaults:
      run:
        working-directory: DeltaText
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x
      - name: Configure native bridge
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build native bridge
        run: cmake --build native/build --config Release
      - name: Restore managed tests
        run: dotnet restore Tests/Delta.Text.Tests.csproj
      - name: Build managed tests
        run: dotnet build Tests/Delta.Text.Tests.csproj -c Release --no-restore --disable-build-servers -m:1 /p:UseSharedCompilation=false
      - name: Install native bridge beside tests
        shell: bash
        run: |
          set -euo pipefail
          output="Tests/bin/Release/net8.0"
          mkdir -p "$output"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            library="$(find native/build -type f -iname 'DeltaTextMsdf.dll' | head -n 1)"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            library="$(find native/build -type f -name 'libDeltaTextMsdf.dylib' | head -n 1)"
          else
            library="$(find native/build -type f -name 'libDeltaTextMsdf.so' | head -n 1)"
          fi
          [[ -n "$library" ]] || { echo 'Native bridge binary was not produced.' >&2; exit 1; }
          cp "$library" "$output/"
      - name: Run native smoke
        run: dotnet run --project Tests/Delta.Text.Tests.csproj -c Release --no-build --no-restore
      - name: Upload native binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DeltaTextMsdf-${{ matrix.os }}
          path: |
            DeltaText/native/build/**/DeltaTextMsdf.dll
            DeltaText/native/build/**/libDeltaTextMsdf.so
            DeltaText/native/build/**/libDeltaTextMsdf.dylib
          if-no-files-found: warn
