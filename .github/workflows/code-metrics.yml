name: Code metrics

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  metrics:
    name: .NET code metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Configure authenticated package source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source \
            --username Artromskiy \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --name github \
            https://nuget.pkg.github.com/Artromskiy/index.json
      - name: Restore
        env:
          SIXLABORS_FEED: https://nuget.pkg.github.com/Artromskiy/index.json
        run: |
          dotnet restore src/DeltaText/DeltaText.csproj \
            -p:SixLaborsFontsPackageSource="$SIXLABORS_FEED" \
            -p:RestoreSources="$SIXLABORS_FEED"
      - name: Release build and managed tests
        run: |
          dotnet build src/DeltaText/DeltaText.csproj -c Release --no-restore \
            --disable-build-servers -m:1 /p:UseSharedCompilation=false
          dotnet build tests/DeltaText.Tests/DeltaText.Tests.csproj -c Release --no-restore \
            --disable-build-servers -m:1 /p:UseSharedCompilation=false
          dotnet run --project tests/DeltaText.Tests/DeltaText.Tests.csproj \
            -c Release --no-build --no-restore
      - name: Verify formatting
        continue-on-error: true
        run: |
          mkdir -p artifacts/code-metrics
          dotnet format whitespace --folder . --exclude ./obj ./bin --verify-no-changes --verbosity minimal 2>&1 | tee artifacts/code-metrics/format.log
      - name: Build and collect analyzer metrics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/code-metrics; set +e
          ./eng/code-metrics.sh 2>&1 | tee artifacts/code-metrics/build.log
          status=${PIPESTATUS[0]}; set -e
          echo "Build exit code: $status" | tee artifacts/code-metrics/summary.txt; exit 0
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-metrics
          path: artifacts/code-metrics
          if-no-files-found: warn
